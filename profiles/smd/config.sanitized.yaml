model:
  default: gpt-5.6-sol
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
fallback_providers:
  - provider: openai-codex
    model: gpt-5.3-codex-spark
terminal:
  cwd: /Users/insideden
memory:
  write_approval: true
moa:
  presets:
    default:
      reference_models:
        - provider: openai-codex
          model: gpt-5.5
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
      aggregator:
        provider: openrouter
        model: anthropic/claude-opus-4.8
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: openai-codex
      model: gpt-5.6-sol
      enabled: true
  aggregator:
    provider: openai-codex
    model: gpt-5.6-sol
  degraded_reference_policy: loud
  max_tokens: <REDACTED>
  fanout: user_turn
  enabled: true
command_allowlist:
  - script execution via heredoc
kanban:
  dispatch_in_gateway: false
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
_config_version: 37
credential_pool_strategies: <REDACTED>
  openai-codex: fill_first
